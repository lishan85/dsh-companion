# Real-boot probe for dsh-companion. tools + system-prompt are the services
# the plugin injects. The plugin itself is the built dist of this workspace.
# `path` is rewritten by probe/boot-probe.mjs to a temporary file.
- id: tools
  name: '@deepseek-ai/dsh-tools'
  config: {}
- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
  config: {}
- id: companion
  name: ../dist/index.js
  config:
    path: probe/tmp/companion.db
