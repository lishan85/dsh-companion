# dsh-companion 的 bundle patch。`path` 没有代码内默认值：原始对话不能
# 落在进程碰巧启动的目录里。部署路径写在这一行，经 `dshHomePath` 解析，
# 所以同一台机器上的各个 profile 共用一份陪伴记录。
#
# 这是一份新库，和上游 dsh-ltm 的 `memory/ltm.db` 无关。`dsh-ltm` 命令仍只
# 管理那份事实记忆库，不会读写这份原始对话。

- insert:
    - id: companion
      name: 'dsh-companion'
      config:
        path: !!js dshHomePath('companion/companion.db')
        recentTurns: 12
        contextRadius: 2
        snippetLimit: 3
        promptMaxChars: 6000
        promptOrder: 12
        defaultPersonId: primary
        searchLimitMax: 20
        emotionEnabled: true
        proactiveEnabled: true
        proactiveDailyCap: 2
        proactiveQuietTimeZone: Asia/Shanghai
        proactiveQuietStart: '23:00'
        proactiveQuietEnd: '08:00'
        proactiveFollowUpHour: 9
        diaryEnabled: true
        diaryTimeZone: Asia/Shanghai
